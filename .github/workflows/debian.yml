name: Build deb package

on:
  push:
    branches: [gnome, main]
  pull_request:
    branches: [gnome, main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake \
            curl \
            libdbus-1-dev \
            libegl-dev \
            libegl1 \
            libgles-dev \
            libwayland-bin \
            libwayland-dev \
            libwayland-egl1 \
            libxkbcommon-dev \
            pkg-config \
            wayland-protocols

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Stage files
        run: |
          PKG_ROOT="$PWD/pkg"
          DESTDIR="$PKG_ROOT" cmake --install build --prefix /usr

          # Install the GNOME Shell schema override
          install -D -m 0644 debian/00-live-whisper-extensions \
            "$PKG_ROOT/usr/share/glib-2.0/schemas/00-live-whisper-extensions.gschema.override"

          # Copy postinst
          mkdir -p "$PKG_ROOT/DEBIAN"
          cp debian/postinst "$PKG_ROOT/DEBIAN/postinst"
          chmod 0755 "$PKG_ROOT/DEBIAN/postinst"

      - name: Compute deps and assemble .deb
        run: |
          set -x
          PKG_ROOT="$PWD/pkg"

          # Compute shlibs dependencies
          SHLIBS=$(dpkg-shlibdeps -O "$PKG_ROOT/usr/bin/live-whisper" | sed 's/^shlibs:Depends=//')

          # Fallback if dpkg-shlibdeps failed
          if [ -z "$SHLIBS" ]; then
            echo "dpkg-shlibdeps failed, using fallback deps"
            SHLIBS="libc6, libdbus-1-3, libegl1, libgcc-s1, libgles2, libstdc++6, libwayland-client0, libwayland-egl1, libxkbcommon0"
          fi

          # Write control file with resolved dependencies
          cat > "$PKG_ROOT/DEBIAN/control" <<- CONTROL
          Package: live-whisper
          Version: 0.0.1-alpha-gnome-1
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: lszl84 <lszl84@users.noreply.github.com>
          Depends: dbus, gnome-shell (>= 45), ${SHLIBS}
          Recommends: gnome-shell-extension-prefs
          Homepage: https://github.com/lszl84/live-whisper
          Description: Speech-to-text overlay for GNOME Shell
           Press a hotkey, speak, and the transcribed text is typed
           into the previously focused window. Uses Whisper.cpp for
           on-device speech recognition and a GNOME Shell extension
           for text injection.
          CONTROL

          # Build the .deb
          mkdir -p dist
          dpkg-deb --build "$PKG_ROOT" \
            "dist/live-whisper_0.0.1-alpha-gnome-1_amd64.deb"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-whisper-0.0.1-alpha-gnome
          path: dist/*.deb
