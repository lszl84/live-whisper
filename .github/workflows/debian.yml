name: Build deb package

on:
  push:
    branches: [gnome, main]
  pull_request:
    branches: [gnome, main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake \
            curl \
            libdbus-1-dev \
            libegl-dev \
            libegl1 \
            libgles-dev \
            libwayland-bin \
            libwayland-dev \
            libwayland-egl1 \
            libxkbcommon-dev \
            pkg-config \
            wayland-protocols

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Stage files
        run: |
          PKG_ROOT="$PWD/pkg"
          DESTDIR="$PKG_ROOT" cmake --install build --prefix /usr

          # Install the GNOME Shell schema override so the extension
          # is automatically enabled for all users.
          install -D -m 0644 debian/00-live-whisper-extensions \
            "$PKG_ROOT/usr/share/glib-2.0/schemas/00-live-whisper-extensions.gschema.override"

          # Copy deb helpers from the repo
          mkdir -p "$PKG_ROOT/DEBIAN"
          cp debian/control   "$PKG_ROOT/DEBIAN/control"
          cp debian/postinst  "$PKG_ROOT/DEBIAN/postinst"
          chmod 0755 "$PKG_ROOT/DEBIAN/postinst"

      - name: Compute shared library deps and build .deb
        run: |
          PKG_ROOT="$PWD/pkg"

          # Substitute shlibs dependencies into control
          SHLIBS=$(dpkg-shlibdeps -O "$PKG_ROOT/usr/bin/live-whisper" 2>/dev/null \
                   | sed "s/shlibs:Depends=//")
          sed -i "s/\${shlibs:Depends}/$SHLIBS/" "$PKG_ROOT/DEBIAN/control"

          mkdir -p dist
          dpkg-deb --build "$PKG_ROOT" \
            "dist/live-whisper_0.0.1-alpha-gnome-1_amd64.deb"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-whisper-0.0.1-alpha-gnome
          path: dist/*.deb
